<form [formGroup]="formGroup" class="flex flex-col gap-1 commands-form">
  <mat-form-field>
    <mat-label>
      Kval
    </mat-label>
    <input matInput name="Kval" formControlName="Kval">
  </mat-form-field>
  <mat-form-field>
    <mat-label>
      Tprepare
    </mat-label>
    <input matInput name="Tprepare" formControlName="Tprepare">
  </mat-form-field>
  <div class="flex gap-4 mb-4 ml-2">
    <span>Clean session</span>
    <mat-slide-toggle formControlName="SenseCheck"></mat-slide-toggle>
  </div>
  <button class="standard-button">{{ DEV_COMMANDS_RU.SEND }}</button>
</form>
