<form [formGroup]="formGroup" class="flex flex-col gap-1 commands-form">
  <mat-form-field>
    <mat-label>
      GNSS Type
    </mat-label>
    <input matInput name="GNSSType" formControlName="GNSSType">
  </mat-form-field>
  <mat-form-field>
    <mat-label>
      GNSS Timeout
    </mat-label>
    <input matInput name="GNSSTimeout" formControlName="GNSSTimeout">
  </mat-form-field>
  <button class="standard-button">{{ DEV_COMMANDS_RU.SEND }}</button>
</form>
