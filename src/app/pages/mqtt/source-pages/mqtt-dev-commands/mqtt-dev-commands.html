<div class="flex flex-col gap-1 h-full">
  <h1>{{ DEV_COMMANDS_RU.HEADER }}<sub>{{ id }}</sub></h1>
  <app-block-head>
    {{ DEV_COMMANDS_RU.COMMANDS }}
  </app-block-head>
  <app-body>
    <div>Текущий статус</div>
    <div class="flex gap-4">
      <div>{{ commandSent || "no command" }}:</div>
      <div>{{ commandStatus || "no status" }}</div>
    </div>
  </app-body>
  <app-body class="h-full">
    <mat-form-field class="w-[400px]">
      <mat-label>Команда</mat-label>
      <mat-select [formControl]="commandSelect" [value]="commandSelect.value">
        @for (commandName of commandsNames; track $index) {
          <mat-option [value]="$index">{{ DEV_COMMAND_NAMES_RU[commandName] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <ng-container *ngComponentOutlet="commands[commandSelect.value || 0]"></ng-container>
  </app-body>
</div>
