<div class="flex flex-col gap-1">
  <h1>{{ DEV_COMMANDS_RU.HEADER }}<sub>{{ id }}</sub></h1>
  <app-block-head>
    {{ DEV_COMMANDS_RU.COMMANDS }}
  </app-block-head>
  <app-body>
    <mat-form-field>
      <mat-label>Команда</mat-label>
      <mat-select [formControl]="commandSelect">
        <mat-option [value]="0">0</mat-option>
        <mat-option [value]="1">1</mat-option>
        <mat-option [value]="2">2</mat-option>
        <mat-option [value]="3">3</mat-option>
      </mat-select>
    </mat-form-field>
    <ng-container *ngComponentOutlet="commands[0]"></ng-container>
  </app-body>
</div>
