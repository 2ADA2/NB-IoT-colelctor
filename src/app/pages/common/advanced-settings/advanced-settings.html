<div class="flex flex-col gap-1 h-full">
  <h1>{{ ADV_SETTINGS_RU.ADV_SETTINGS }}</h1>

  <app-block-head>
    {{ ADV_SETTINGS_RU.SETTINGS }}
  </app-block-head>
  <app-body>
    <textarea
      name="console-text"
      class="console-area"
      [formControl]="consoleText"
    ></textarea>
    <button class="standard-button m-auto mt-2">
      {{ ADV_SETTINGS_RU.SAVE }}
    </button>
  </app-body>

  <app-block-head>
    {{ ADV_SETTINGS_RU.UPDATE }}
  </app-block-head>
  <app-body>
    <div class="flex flex-col items-center justify-center m-auto">
      <h3>Frontend</h3>
      <div class="file-input-wrapper">
        <label class="file-label">
          {{ frontFileName || ADV_SETTINGS_RU.CHOOSE_FILE }}
          <input type="file" (change)="frontFileSelect($event)">
        </label>
      </div>
    </div>
    <div class="flex flex-col items-center justify-center m-auto">
      <h3>Backend</h3>
      <div class="file-input-wrapper">
        <label class="file-label">
          {{ backFileName || ADV_SETTINGS_RU.CHOOSE_FILE }}
          <input type="file" (change)="backFileSelect($event)">
        </label>
      </div>
    </div>
    <button class="standard-button m-auto mt-2" (click)="sendFiles()">
      {{ ADV_SETTINGS_RU.SAVE }}
    </button>
  </app-body>
</div>
