<div class="flex flex-col gap-1">
  <h1>Настройки</h1>
  <form class="flex flex-col gap-1">
    <app-block-head>
      Connection Details
    </app-block-head>
    <app-body>
      <div class="standard-container">
        <span>Host Name</span>
        <input type="text" class="standard-input">
      </div>
      <div class="standard-container">
        <span>Port</span>
        <input type="number" [min]="1000" [max]="10000" class="standard-input">
      </div>
      <div class="standard-container">
        <span>Client ID</span>
        <input type="number" [min]="0" class="standard-input">
      </div>
      <div class="standard-container">
        <span>Clean Session</span>
        <mat-slide-toggle></mat-slide-toggle>
      </div>
      <div class="standard-container">
        <span>Keep Alive</span>
        <input type="number" [min]="0" class="standard-input">
      </div>
    </app-body>

    <app-block-head>
      Credentials
    </app-block-head>
    <app-body class="">
      <div class="standard-container">
        <span>Name</span>
        <input type="text" class="standard-input">
      </div>
      <div class="standard-container">
        <span>Password</span>
        <input type="text" class="standard-input">
      </div>
    </app-body>

    <app-block-head>
      Last-Will
    </app-block-head>
    <app-body class="">
      <div class="standard-container">
        <span>Last-Will Topic</span>
        <input type="text" class="standard-input">
      </div>
      <div class="standard-container">
        <span>Last-Will Message</span>
        <input type="text" class="standard-input">
      </div>
      <div class="standard-container">
        <span>Last-Will Qos</span>
        <mat-form-field class="my-select" style="max-width: 300px">
          <mat-select [(ngModel)]="LWQos" name="LWQos">
            @for(lw of LWData; track lw) {
              <mat-option [value]="lw.val">{{lw.viewValue}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="standard-container">
        <span>Last-Will Retain</span>
        <mat-slide-toggle></mat-slide-toggle>
      </div>
      <button class="standard-button m-auto mt-4">Сохранить</button>
    </app-body>

  </form>

</div>
