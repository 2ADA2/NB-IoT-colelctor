<div class="flex flex-col gap-1 h-full">
  <h1>Главная</h1>

  <app-block-head>
    Панель управления ШС-219
  </app-block-head>

  <app-body class="h-full">
    <div class="page-nav flex gap-2">
      <button (click)="setNum(1)" [class.active]="pageNum===1">{{ HOME_RU.INFO }}</button>
      <button (click)="setNum(2)" [class.active]="pageNum===2">{{ HOME_RU.CONSOLE }}</button>
    </div>

    @if (pageNum === 1) {
      <app-home-info></app-home-info>
    } @else {
      <app-home-console></app-home-console>
    }
  </app-body>
</div>
